[project]
name = "autonomous-saas-triager"
version = "0.1.0"
description = "Autonomous L1 support agent that investigates tickets against real logs and source, and refuses to escalate or resolve without verified evidence."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rhain Rivera" }]
keywords = ["agentic-ai", "support-automation", "root-cause-analysis", "llm", "devtools"]

dependencies = [
    "anthropic>=0.40",
    "google-genai>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

# PEP 735 group rather than an optional-dependencies extra: uv installs this by
# default, so `uv run` never silently drops the test and eval tooling.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
triage = "agent.__main__:app"

[project.urls]
Repository = "https://github.com/rhain-r/autonomous-saas-triager"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
# Matches the lower bound of requires-python, not the pinned dev interpreter, so
# lint does not suggest syntax that would break on 3.10.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # typer.Option() in defaults is the documented Typer idiom
    "BLE001", # broad excepts are load-bearing: a challenger crash must not read
              # as agreement, and a bad patch proposal must not crash a run
    "RUF002", # en dashes and typographic quotes are deliberate in prose and in
    "RUF003", # log fixtures; flagging them is noise
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agent"]
omit = ["agent/tests/*"]
